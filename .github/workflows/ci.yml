name: C++ checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cail-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep this in step with CLANG_FORMAT_VERSION in ./dev. The pip package is
  # version exact, so CI and local runs cannot drift apart.
  CLANG_FORMAT_VERSION: 23.1.1

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install clang-format
        run: |
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/python" -m pip install --disable-pip-version-check \
            "clang-format==$CLANG_FORMAT_VERSION"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: ./dev format

  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CAIL_FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.cache/cail-fetchcontent
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 1G
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (gcc)
            os: ubuntu-24.04
            cxx: g++
            packages: ""
            examples: ON
          # Clang 18 on Ubuntu cannot use libstdc++'s C++23 <expected>, which
          # Glaze and CAIL both need, so the matrix uses Clang 20.
          - name: Linux (clang)
            os: ubuntu-24.04
            cxx: clang++-20
            packages: clang-20
            examples: OFF
          - name: macOS (AppleClang)
            os: macos-15
            cxx: clang++
            packages: ""
            examples: OFF
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache ninja-build libssl-dev ${{ matrix.packages }}

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ccache openssl@3

      - name: Prepare compiler cache
        run: mkdir -p .cache/ccache

      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: .cache/ccache
          key: cail-ccache-${{ runner.os }}-${{ matrix.cxx }}-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cail-ccache-${{ runner.os }}-${{ matrix.cxx }}-${{ github.ref }}-
            cail-ccache-${{ runner.os }}-${{ matrix.cxx }}-

      - name: Install CMake
        run: |
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/python" -m pip install --disable-pip-version-check \
            "cmake==$(cat ci/cmake-version.txt)"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      - name: Restore dependency checkout
        uses: actions/cache@v6
        with:
          path: .cache/cail-fetchcontent
          key: cail-deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            cail-deps-${{ runner.os }}-

      - name: Configure
        env:
          CXX: ${{ matrix.cxx }}
          CAIL_BUILD_EXAMPLES: ${{ matrix.examples }}
        run: ./dev configure -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: ./dev build

      - name: Test
        run: ./dev test --all

      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.name }}
          path: |
            build/dev/results.xml
            build/dev/Testing/Temporary/
          if-no-files-found: ignore

  sanitizer:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CAIL_FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.cache/cail-fetchcontent
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 1G
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan and UBSan
            command: sanitizer
            directory: build/asan
          - name: ThreadSanitizer
            command: thread-sanitizer
            directory: build/tsan
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache ninja-build g++ libssl-dev

      - name: Prepare compiler cache
        run: mkdir -p .cache/ccache

      - name: Install CMake
        run: |
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/python" -m pip install --disable-pip-version-check \
            "cmake==$(cat ci/cmake-version.txt)"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: .cache/ccache
          key: cail-ccache-${{ runner.os }}-g++-${{ matrix.command }}-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cail-ccache-${{ runner.os }}-g++-${{ matrix.command }}-${{ github.ref }}-
            cail-ccache-${{ runner.os }}-g++-${{ matrix.command }}-

      - name: Restore dependency checkout
        uses: actions/cache@v6
        with:
          path: .cache/cail-fetchcontent
          key: cail-deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            cail-deps-${{ runner.os }}-

      - name: Configure sanitizers
        run: ./dev ${{ matrix.command }} --configure-only -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: ./dev build ${{ matrix.directory }}

      - name: Test
        run: ./dev test ${{ matrix.directory }} --all

      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.command }}
          path: |
            ${{ matrix.directory }}/results.xml
            ${{ matrix.directory }}/Testing/Temporary/
          if-no-files-found: ignore

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build g++ libssl-dev clang-tidy-20
          # Ubuntu's default Clang cannot parse libstdc++'s C++23 <expected> header.
          sudo ln -sf /usr/bin/clang-tidy-20 /usr/local/bin/clang-tidy

      - name: Install CMake
        run: |
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/python" -m pip install --disable-pip-version-check \
            "cmake==$(cat ci/cmake-version.txt)"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      - name: Restore dependency checkout
        uses: actions/cache@v6
        with:
          path: .cache/cail-fetchcontent
          key: cail-deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            cail-deps-${{ runner.os }}-

      # clang-tidy only needs the compile commands, not a built binary.
      - name: Configure
        env:
          CAIL_BUILD_EXAMPLES: OFF
          CAIL_FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.cache/cail-fetchcontent
        run: |
          mkdir -p .cache/cail-fetchcontent
          ./dev configure

      - name: Run clang-tidy
        run: ./dev tidy
